<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrackPoint | Connect Device</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #121821;
            border: 1px solid #26303d;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin: auto;
            border-radius: 16px;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-top: 15px;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #8d99a8;
            margin-top: 8px;
            line-height: 1.5;
        }

        .device-box {
            margin-top: 25px;
            background: #0d131b;
            border: 1px solid #26303d;
            border-radius: 14px;
            padding: 18px;
        }

        .label {
            color: #7f8b9a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .device-name {
            font-size: 20px;
            font-weight: bold;
            margin-top: 6px;
        }

        .device-id {
            font-size: 12px;
            color: #6f7a88;
            margin-top: 7px;
            word-break: break-all;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .status {
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            background: #0d131b;
            border: 1px solid #26303d;
            color: #9ba6b5;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .info {
            margin-top: 20px;
            color: #7f8b9a;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">TP</div>
    </div>

    <h1>Connect Device</h1>

    <p class="subtitle">
        This device can share its location with your TrackPoint dashboard
        after you give permission.
    </p>

    <div class="device-box">
        <div class="label">Device</div>

        <div class="device-name" id="deviceName">
            Loading...
        </div>

        <div class="device-id" id="deviceId"></div>
    </div>

    <button id="connectBtn" onclick="connectDevice()">
        Allow Location & Connect
    </button>

    <div class="status" id="status">
        Waiting for connection...
    </div>

    <div class="info">
        Your browser will ask for location permission.
        Location sharing only starts after you press the button above.
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://zlzbbtoainxzvgocxpmb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MV7UbRGe-c1TiR_YE4s-vA_uX1ThRm_";

const params = new URLSearchParams(window.location.search);

const deviceId = params.get("device");

const deviceNameElement =
    document.getElementById("deviceName");

const deviceIdElement =
    document.getElementById("deviceId");

const statusElement =
    document.getElementById("status");

const connectBtn =
    document.getElementById("connectBtn");

let watchId = null;


/* =========================
   LOAD DEVICE
========================= */

async function loadDevice() {

    if (!deviceId) {

        deviceNameElement.textContent =
            "Invalid device";

        deviceIdElement.textContent =
            "No device ID was provided.";

        connectBtn.disabled = true;

        statusElement.innerHTML =
            '<span class="error">Invalid connection link.</span>';

        return;
    }

    deviceIdElement.textContent =
        deviceId;

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/devices?id=eq.${encodeURIComponent(deviceId)}&select=id,device_name,device_code,status`,
            {
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization:
                        `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!response.ok) {
            throw new Error("Could not load device.");
        }

        const devices = await response.json();

        if (!devices.length) {

            deviceNameElement.textContent =
                "Device not found";

            statusElement.innerHTML =
                '<span class="error">This device does not exist.</span>';

            connectBtn.disabled = true;

            return;
        }

        const device = devices[0];

        deviceNameElement.textContent =
            device.device_name;

        statusElement.textContent =
            "Ready to connect.";

    } catch (error) {

        console.error(error);

        statusElement.innerHTML =
            '<span class="error">Unable to connect to TrackPoint.</span>';
    }
}


/* =========================
   CONNECT DEVICE
========================= */

async function connectDevice() {

    if (!deviceId) {
        return;
    }

    if (!navigator.geolocation) {

        statusElement.innerHTML =
            '<span class="error">This browser does not support location services.</span>';

        return;
    }

    connectBtn.disabled = true;

    statusElement.textContent =
        "Requesting location permission...";

    try {

        const position =
            await getCurrentPosition();

        await sendLocation(position);

        statusElement.innerHTML =
            '<span class="success">Device connected successfully.</span>';

        startTracking();

    } catch (error) {

        console.error(error);

        connectBtn.disabled = false;

        if (error.code === 1) {

            statusElement.innerHTML =
                '<span class="error">Location permission was denied.</span>';

        } else if (error.code === 2) {

            statusElement.innerHTML =
                '<span class="error">Your location could not be determined.</span>';

        } else if (error.code === 3) {

            statusElement.innerHTML =
                '<span class="error">Location request timed out.</span>';

        } else {

            statusElement.innerHTML =
                '<span class="error">Could not connect this device.</span>';
        }
    }
}


/* =========================
   GET LOCATION
========================= */

function getCurrentPosition() {

    return new Promise((resolve, reject) => {

        navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 15000
            }
        );

    });
}


/* =========================
   SEND LOCATION
========================= */

async function sendLocation(position) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;

    const recordedAt =
        new Date().toISOString();


    /* Save location history */

    const locationResponse =
        await fetch(
            `${SUPABASE_URL}/rest/v1/device_locations`,
            {
                method: "POST",

                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization:
                        `Bearer ${SUPABASE_KEY}`,
                    "Content-Type":
                        "application/json",
                    Prefer: "return=minimal"
                },

                body: JSON.stringify({
                    device_id: deviceId,
                    latitude: latitude,
                    longitude: longitude,
                    accuracy: accuracy,
                    recorded_at: recordedAt
                })
            }
        );


    if (!locationResponse.ok) {

        const errorText =
            await locationResponse.text();

        console.error(errorText);

        throw new Error(
            "Failed to save location."
        );
    }


    /* Update device */

    const deviceResponse =
        await fetch(
            `${SUPABASE_URL}/rest/v1/devices?id=eq.${encodeURIComponent(deviceId)}`,
            {
                method: "PATCH",

                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization:
                        `Bearer ${SUPABASE_KEY}`,
                    "Content-Type":
                        "application/json",
                    Prefer: "return=minimal"
                },

                body: JSON.stringify({

                    status: "online",

                    last_latitude:
                        latitude,

                    last_longitude:
                        longitude,

                    last_accuracy:
                        accuracy,

                    last_seen:
                        recordedAt
                })
            }
        );


    if (!deviceResponse.ok) {

        throw new Error(
            "Failed to update device."
        );
    }


    console.log(
        "Location sent:",
        latitude,
        longitude,
        accuracy
    );
}


/* =========================
   CONTINUOUS TRACKING
========================= */

function startTracking() {

    if (watchId !== null) {
        return;
    }

    watchId =
        navigator.geolocation.watchPosition(

            async position => {

                try {

                    await sendLocation(position);

                    statusElement.innerHTML =
                        '<span class="success">Connected • Location updating</span>';

                } catch (error) {

                    console.error(error);

                    statusElement.innerHTML =
                        '<span class="error">Connected, but location update failed.</span>';
                }

            },

            error => {

                console.error(error);

                statusElement.innerHTML =
                    '<span class="error">Location updates stopped.</span>';

                connectBtn.disabled = false;
            },

            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 15000
            }
        );
}


/* =========================
   START
========================= */

loadDevice();

</script>

</body>
</html>
