<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrackPoint | Connect Device</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1118;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: #111a24;
            border: 1px solid #263443;
            border-radius: 18px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .logo span {
            color: #3b82f6;
        }

        h1 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        p {
            color: #91a0b2;
            line-height: 1.6;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: 0;
            border-radius: 11px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: #0c141d;
            border: 1px solid #263443;
            border-radius: 12px;
            text-align: left;
            font-size: 13px;
            line-height: 1.8;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .location {
            margin-top: 15px;
            display: grid;
            gap: 8px;
        }

        .location div {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .location span:first-child {
            color: #7f8da0;
        }

        .location span:last-child {
            color: white;
            font-weight: 600;
            text-align: right;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        Track<span>Point</span>
    </div>

    <h1>Connect This Phone</h1>

    <p>
        Allow location access so this phone can send its
        real GPS position to your TrackPoint dashboard.
    </p>

    <button id="connectButton">
        Allow Location & Connect
    </button>

    <div class="status" id="status">
        Waiting for permission...
    </div>

    <div class="location">

        <div>
            <span>Latitude</span>
            <span id="latitude">—</span>
        </div>

        <div>
            <span>Longitude</span>
            <span id="longitude">—</span>
        </div>

        <div>
            <span>Accuracy</span>
            <span id="accuracy">—</span>
        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://zlzbbtoainxzvgocxpmb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MV7UbRGe-c1TiR_YE4s-vA_uX1ThRm_";


/* =========================
   DEVICE ID
========================= */

const params = new URLSearchParams(
    window.location.search
);

const deviceId = params.get("device");


/* =========================
   ELEMENTS
========================= */

const connectButton =
    document.getElementById("connectButton");

const statusBox =
    document.getElementById("status");

const latitudeElement =
    document.getElementById("latitude");

const longitudeElement =
    document.getElementById("longitude");

const accuracyElement =
    document.getElementById("accuracy");


let watchId = null;


/* =========================
   STATUS
========================= */

function setStatus(message, type = "") {

    statusBox.textContent = message;

    statusBox.className = "status";

    if (type) {
        statusBox.classList.add(type);
    }
}


/* =========================
   SEND GPS TO SUPABASE
========================= */

async function sendLocation(position) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    latitudeElement.textContent =
        latitude.toFixed(6);

    longitudeElement.textContent =
        longitude.toFixed(6);

    accuracyElement.textContent =
        `${accuracy.toFixed(1)} m`;


    setStatus(
        "GPS location received. Sending to TrackPoint...",
    );


    if (!deviceId) {

        setStatus(
            "No device ID was supplied in the connection link.",
            "error"
        );

        return;
    }


    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/devices?id=eq.${encodeURIComponent(deviceId)}`,
            {
                method: "PATCH",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=minimal"
                },

                body: JSON.stringify({

                    last_latitude:
                        latitude,

                    last_longitude:
                        longitude,

                    last_accuracy:
                        accuracy,

                    last_seen:
                        new Date().toISOString()

                })
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.error(
                "Supabase error:",
                errorText
            );

            setStatus(
                "GPS was received, but TrackPoint could not save it.",
                "error"
            );

            return;
        }


        setStatus(
            "Connected. This phone is now sending its real GPS location.",
            "success"
        );


        console.log(
            "GPS sent:",
            latitude,
            longitude,
            accuracy
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "Could not send GPS location to TrackPoint.",
            "error"
        );
    }
}


/* =========================
   GPS ERROR
========================= */

function gpsError(error) {

    console.error(error);

    if (error.code === 1) {

        setStatus(
            "Location permission was denied. Please allow location access.",
            "error"
        );

    } else if (error.code === 2) {

        setStatus(
            "Your phone could not determine its GPS location.",
            "error"
        );

    } else if (error.code === 3) {

        setStatus(
            "GPS request timed out. Trying again...",
            "error"
        );

    } else {

        setStatus(
            "Unable to get GPS location.",
            "error"
        );
    }
}


/* =========================
   START GPS
========================= */

function startGPS() {

    if (!navigator.geolocation) {

        setStatus(
            "This browser does not support GPS location.",
            "error"
        );

        return;
    }


    if (!window.isSecureContext) {

        setStatus(
            "GPS requires HTTPS. Open the Vercel HTTPS link.",
            "error"
        );

        return;
    }


    if (!deviceId) {

        setStatus(
            "This connection link does not contain a device ID.",
            "error"
        );

        return;
    }


    connectButton.disabled = true;

    connectButton.textContent =
        "Connecting GPS...";


    setStatus(
        "Requesting your phone's GPS location..."
    );


    /*
       watchPosition continuously watches
       the REAL GPS location of this phone.
    */

    watchId =
        navigator.geolocation.watchPosition(

            sendLocation,

            gpsError,

            {
                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: 15000
            }
        );
}


/* =========================
   BUTTON
========================= */

connectButton.addEventListener(
    "click",
    startGPS
);


/* =========================
   CHECK DEVICE LINK
========================= */

if (!deviceId) {

    connectButton.disabled = true;

    setStatus(
        "Invalid connection link. No device ID found.",
        "error"
    );
}

</script>

</body>
</html>
